[package]
name = "ray-core"
version = "0.0.0"
edition = "2021"

# Núcleo Tauri do Ray (ADR-001). Captura de áudio, janelas/stealth, cofre de
# credenciais, supervisão do sidecar e IPC. Os structs de fronteira (ipc.rs)
# usam ts-rs para GERAR contracts/ipc.ts (ADR-010).

[lib]
name = "ray_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "10"
# HTTP client para falar com o sidecar em loopback (ADR-005).
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"

# Cofre de credenciais nativo por plataforma (ADR-003).
# Features por SO: apple-native (macOS), linux-native (Linux), windows-native (Windows).

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
