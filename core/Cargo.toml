[package]
name = "ray-core"
version = "0.0.0"
edition = "2021"

# Núcleo Tauri do Ray (ADR-001). Captura de áudio, janelas/stealth, cofre de
# credenciais, supervisão do sidecar e IPC. Os structs de fronteira (ipc.rs)
# usam ts-rs para GERAR contracts/ipc.ts (ADR-010).

[lib]
name = "ray_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "10"
# HTTP client para falar com o sidecar em loopback (ADR-005).
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
# Cofre de credenciais nativo por plataforma (ADR-003).
keyring = "3"
thiserror = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
